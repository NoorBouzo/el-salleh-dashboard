<script>
const D={"dates": ["2026-10-22"], "brands": ["الشيف نديم", "العبور", "حسين الناصر"], "series": {"الشيف نديم": [18669], "العبور": [17850], "حسين الناصر": [93800]}, "change": [{"brand": "الشيف نديم", "last": 18669, "prev": null, "pct": null}, {"brand": "العبور", "last": 17850, "prev": null, "pct": null}, {"brand": "حسين الناصر", "last": 93800, "prev": null, "pct": null}], "updated": "2026-10-22 05:20", "n": 1};
const PALE=['#7B4FF0','#4B2FA6','#2BC48A','#E67E22','#C0392B','#2980B9','#8E44AD','#16A085','#D35400','#7F8C8D'];
Chart.defaults.font.family="'Cairo',sans-serif";
document.getElementById('info').textContent =
  D.n<=1 ? `لحد الآن عندنا سحبة واحدة فقط — الرسوم بتبيّن الاتجاه بعد سحبتين أو أكثر (كل 3 أيام بتنضاف نقطة جديدة لكل ماركة).`
         : `عدد السحبات: ${D.n} — كل ماركة إلها خط بيبيّن إذا سعرها طلع أو نزل عبر الزمن.`;
// chart كل الماركات
new Chart(document.getElementById('allChart'),{type:'line',
 data:{labels:D.dates,datasets:D.brands.map((b,i)=>({label:b,data:D.series[b],borderColor:PALE[i%PALE.length],
   backgroundColor:PALE[i%PALE.length],tension:.25,spanGaps:true,pointRadius:4}))},
 options:{plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}},scales:{y:{beginAtZero:false,title:{display:true,text:'متوسط السعر (ل.س)'}}}}});
// جدول التغير
document.querySelector('#chgTbl tbody').innerHTML = D.change.map(c=>{
 let cell='<span class="flat">—</span>';
 if(c.pct!==null){ const cls=c.pct>0?'up':(c.pct<0?'down':'flat'); const ar=c.pct>0?'▲':(c.pct<0?'▼':'■');
   cell=`<span class="${cls}">${ar} ${Math.abs(c.pct)}%</span>`; }
 return `<tr><td>${c.brand}</td><td>${c.prev!==null?c.prev.toLocaleString():'—'}</td><td>${c.last.toLocaleString()}</td><td>${cell}</td></tr>`;
}).join('');
// mini charts لكل ماركة
const grid=document.getElementById('miniGrid');
D.brands.forEach((b,i)=>{
 const p=document.createElement('div');p.className='panel';
 p.innerHTML=`<h3>${b}</h3><canvas id="m${i}"></canvas>`;grid.appendChild(p);
 new Chart(p.querySelector('canvas'),{type:'line',
  data:{labels:D.dates,datasets:[{data:D.series[b],borderColor:PALE[i%PALE.length],backgroundColor:PALE[i%PALE.length],tension:.25,spanGaps:true,pointRadius:4,fill:false}]},
  options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:false}}}});
});
